# This rule is not used by the project llm-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to ai.mlo.platform resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: llm-operator
    app.kubernetes.io/managed-by: kustomize
  name: llmoptimizedservice-viewer-role
rules:
- apiGroups:
  - ai.mlo.platform
  resources:
  - llmoptimizedservices
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ai.mlo.platform
  resources:
  - llmoptimizedservices/status
  verbs:
  - get
