apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: m5-ai-inference-platform
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/RoopGuron/local-llm-inference-control-plane.git'
    targetRevision: HEAD
    path: gitops-infra/apps
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
