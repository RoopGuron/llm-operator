apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-go-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/RoopGuron/local-llm-inference-control-plane.git'
    targetRevision: HEAD
    path: gitops-infra/system-operators
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default          # Kubebuilder bundles define their own namespaces, default is safe here
  syncPolicy:
    automated:
      prune: true
      selfHeal: true