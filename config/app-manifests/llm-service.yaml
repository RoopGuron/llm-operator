apiVersion: v1
kind: Service
metadata:
  name: mac-llm-api
  namespace: default
spec:
  type: ExternalName
  # Use host.docker.internal for local dev environments like Docker Desktop or Kind
  externalName: host.docker.internal
---
apiVersion: v1
kind: Pod
metadata:
  name: ubuntu-troubleshoot
  namespace: default
spec:
  containers:
  - name: ubuntu
    image: ubuntu:latest
    # Keeps the container running so you can exec into it
    command: [ "sleep", "infinity" ]
