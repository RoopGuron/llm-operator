apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmoptimizedservices.ai.mlo.platform
spec:
  group: ai.mlo.platform
  names:
    kind: LLMOptimizedService
    listKind: LLMOptimizedServiceList
    plural: llmoptimizedservices
    singular: llmoptimizedservice
  scope: Namespaced
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMOptimizedService is the Schema for the llmoptimizedservices
          API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of LLMOptimizedService
            properties:
              idleTimeoutSeconds:
                description: |-
                  IdleTimeoutSeconds sets how long the queue-length metric must stay
                  below threshold before KEDA scales to 0. Only used when ScaleToZero is
                  true; defaults to 300 (5 minutes) if unset.
                format: int32
                type: integer
              maxConcurrencyPerPod:
                description: MaxConcurrencyPerPod sets parallel thread processing
                  density per engine
                format: int32
                type: integer
              maxReplicas:
                description: MaxReplicas sets the ceiling target for Week 3 KEDA structures
                format: int32
                type: integer
              minReplicas:
                description: MinReplicas sets the baseline scaling target floor
                format: int32
                type: integer
              modelPath:
                description: ModelPath represents the model layout name, e.g., "llama3"
                  or "mistral"
                type: string
              scaleToZero:
                description: |-
                  ScaleToZero lets KEDA scale the Deployment down to 0 replicas after
                  IdleTimeoutSeconds of no load, instead of holding at MinReplicas. Model
                  weights stay cached on the node's hostPath volume, so scaling back up
                  re-pulls quickly, but there is no automatic wake-on-request: at 0
                  replicas nothing is running to observe new traffic, so bringing
                  replicas back above 0 is a manual step (e.g. kubectl scale).
                type: boolean
            required:
            - maxConcurrencyPerPod
            - modelPath
            type: object
          status:
            description: status defines the observed state of LLMOptimizedService
            properties:
              availableReplicas:
                description: |-
                  conditions represent the current state of the LLMOptimizedService resource.
                  Each condition has a unique type and reflects the status of a specific aspect of the resource.

                  Standard condition types include:
                  - "Available": the resource is fully functional
                  - "Progressing": the resource is being created or updated
                  - "Degraded": the resource failed to reach or maintain its desired state

                  The status of each condition is one of True, False, or Unknown.
                format: int32
                type: integer
              phase:
                type: string
            required:
            - availableReplicas
            - phase
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
